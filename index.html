<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Media Uploader</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b141a;
    --panel: #111b21;
    --panel-hover: #202c33;
    --border: #2a3942;
    --text: #e9edef;
    --text-muted: #8696a0;
    --green: #00a884;
    --green-hover: #029475;
    --red: #f15c6d;
    --input-bg: #2a3942;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body {
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    width: 100%;
    max-width: 650px;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }
  .header {
    background: rgba(32, 44, 51, 0.8);
    backdrop-filter: blur(10px);
    padding: 20px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    gap: 15px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
  }
  .header h1 span { color: var(--green); }
  .header-right {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .status-badge {
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(241, 92, 109, 0.15);
    color: var(--red);
    font-weight: 600;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s;
  }
  .status-badge::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
  }
  .status-badge.connected {
    background: rgba(0, 168, 132, 0.15);
    color: var(--green);
  }
  .status-badge.connected::before {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }
  .uptime-text {
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    text-align: center;
    width: 100%;
  }
  .uptime-text span { font-weight: 600; }
  .uptime-text #uptime { color: var(--green); font-weight: 600; }
  .uptime-text #botLabel { color: var(--red); }
  .uptime-text #botLabel.on { color: var(--green); }
  .uptime-text #uptimeWrap { display: none; color: var(--text-muted); }
  .uptime-text #uptimeWrap.show { display: inline; }

  .content { padding: 25px; }
  .form-group { margin-bottom: 20px; }
  label {
    display: block;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 500;
  }
  input, textarea {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
  }
  input:focus, textarea:focus {
    border-color: var(--green);
    background: #202c33;
    box-shadow: 0 0 0 3px rgba(0, 168, 132, 0.1);
  }
  input[type="file"] { padding: 10px; cursor: pointer; }
  textarea { resize: vertical; min-height: 90px; }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--green);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.2s;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }
  button:hover { background: var(--green-hover); transform: translateY(-1px); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .file-info {
    margin-top: 10px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-muted);
    background: var(--bg);
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px dashed var(--border);
    display: none;
  }
  .file-info.ok { border-color: var(--green); color: var(--green); }
  .file-info.err { border-color: var(--red); color: var(--red); }

  /* PROGRESS BAR */
  .progress-container {
    width: 100%;
    background-color: var(--border);
    border-radius: 8px;
    margin-top: 15px;
    display: none;
    overflow: hidden;
  }
  .progress-bar {
    width: 0%;
    height: 20px;
    background-color: var(--green);
    text-align: center;
    line-height: 20px;
    color: white;
    font-size: 12px;
    font-weight: bold;
    transition: width 0.2s ease;
  }
  
  /* TEKS PERINGATAN TEBAL */
  .warning-text {
    font-size: 12px;
    color: var(--red);
    margin-top: 8px;
    font-weight: 800; /* Bold Tebal */
    display: none;
    text-align: center;
    letter-spacing: 0.5px;
  }
  .warning-text.show { display: block; }

  .result {
    margin-top: 20px;
    padding: 20px;
    background: #0d1418;
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    white-space: pre-wrap;
    border: 1px solid var(--border);
    display: none;
    max-height: 400px;
    overflow-y: auto;
    color: #a8c7fa;
    line-height: 1.6;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--panel-hover);
    color: var(--text);
    padding: 12px 24px;
    border-radius: 8px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    border-left: 4px solid var(--green);
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    z-index: 1000;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.error { border-left-color: var(--red); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1><span>📤</span> WA Media Uploader</h1>
    <div class="header-right">
      <div class="status-badge" id="status">Offline</div>
      <div class="uptime-text">
        <span id="botLabel">Bot off</span><span id="uptimeWrap">: <span id="uptime">--:--:--</span></span>
      </div>
    </div>
  </div>
  
  <div class="content">
    <div class="form-group">
      <label>Nomor / Link Grup Tujuan</label>
      <input type="text" id="to" placeholder="08123456789 atau https://chat.whatsapp.com/...">
    </div>

    <div class="form-group">
      <label>Caption (Opsional)</label>
      <textarea id="caption" placeholder="Tulis caption untuk media..."></textarea>
    </div>

    <div class="form-group">
      <label>Upload Foto / Video</label>
      <input type="file" id="fileInput" accept="image/*, video/*">
      <div class="file-info" id="fileInfo"></div>
    </div>

    <!-- PROGRESS BAR & PERINGATAN TEBAL -->
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>
    <div class="warning-text" id="warningText">
      ⚠️ PERHATIAN: KECEPATAN PENGIRIMAN TERGANTUNG PADA KECEPATAN JARINGAN ANDA.
    </div>

    <button onclick="sendMedia()" id="btnSend">🚀 Kirim Media</button>

    <div class="result" id="result"></div>
  </div>
</div>

<div id="toast">Notifikasi</div>

<script>
  // ==================== KONFIGURASI API ====================
  const API_URL = "http://163.52.135.145:3425"; // Masukkan URL Panel Anda di sini
  const API_KEY = "X9363937397398636"; // Masukkan API Key Anda
  // ======================================================================

  const MAX_IMAGE_SIZE = 20 * 1024 * 1024; // 20 MB
  const MAX_VIDEO_SIZE = 40 * 1024 * 1024; // 40 MB

  const statusBadge = document.getElementById('status');
  const resultBox = document.getElementById('result');
  const btnSend = document.getElementById('btnSend');
  const fileInput = document.getElementById('fileInput');
  const fileInfo = document.getElementById('fileInfo');
  const botLabel = document.getElementById('botLabel');
  const uptimeEl = document.getElementById('uptime');
  const uptimeWrap = document.getElementById('uptimeWrap');
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  const warningText = document.getElementById('warningText');

  function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = isError ? 'show error' : 'show';
    setTimeout(() => { toast.className = ''; }, 3000);
  }

  function formatSize(bytes) {
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  // ==================== VALIDASI FILE ====================
  fileInput.addEventListener('change', () => {
    fileInfo.style.display = 'none';
    fileInfo.className = 'file-info';
    if (!fileInput.files.length) return;

    const file = fileInput.files[0];
    const isImage = file.type.startsWith('image/');
    const isVideo = file.type.startsWith('video/');

    if (!isImage && !isVideo) {
      fileInfo.className = 'file-info err';
      fileInfo.textContent = `❌ Tipe file tidak didukung. Hanya foto/video.`;
      fileInfo.style.display = 'block';
      fileInput.value = '';
      return;
    }

    const maxSize = isImage ? MAX_IMAGE_SIZE : MAX_VIDEO_SIZE;
    const maxLabel = isImage ? '20 MB' : '40 MB';

    if (file.size > maxSize) {
      fileInfo.className = 'file-info err';
      fileInfo.textContent = `❌ ${isImage ? 'Foto' : 'Video'} terlalu besar: ${formatSize(file.size)} (maks ${maxLabel})`;
      fileInfo.style.display = 'block';
      fileInput.value = '';
      return;
    }

    fileInfo.className = 'file-info ok';
    fileInfo.textContent = `✅ ${isImage ? 'Foto' : 'Video'} siap: ${file.name} (${formatSize(file.size)} / maks ${maxLabel})`;
    fileInfo.style.display = 'block';
  });

  // ==================== STATUS & UPTIME ====================
  function setBotStatus(connected, badgeText) {
    if (connected) {
      statusBadge.classList.add('connected');
      botLabel.textContent = 'Bot on';
      botLabel.classList.add('on');
      uptimeWrap.classList.add('show');
    } else {
      statusBadge.classList.remove('connected');
      botLabel.textContent = 'Bot off';
      botLabel.classList.remove('on');
      uptimeWrap.classList.remove('show');
      uptimeEl.textContent = '--:--:--';
    }
    statusBadge.textContent = badgeText;
  }

  async function checkStatusAndUptime() {
    if (!API_URL || !API_KEY) return;
    try {
      const res = await fetch(`${API_URL}/status`, { headers: { 'x-api-key': API_KEY } });

      if (res.status === 401) {
        setBotStatus(false, 'API Key Salah');
        return;
      }

      const data = await res.json();
      if (data.connected) {
        setBotStatus(true, 'Terhubung');

        const resUptime = await fetch(`${API_URL}/uptime`, { headers: { 'x-api-key': API_KEY } });
        if (resUptime.ok) {
          const dataUptime = await resUptime.json();
          const diff = dataUptime.uptime;
          let hours = Math.floor(diff / (1000 * 60 * 60));
          let minutes = Math.floor((diff / (1000 * 60)) % 60);
          let seconds = Math.floor((diff / 1000) % 60);
          uptimeEl.textContent =
            String(hours).padStart(2, '0') + ':' +
            String(minutes).padStart(2, '0') + ':' +
            String(seconds).padStart(2, '0');
        }
      } else {
        setBotStatus(false, 'Belum Pairing');
      }
    } catch (e) {
      setBotStatus(false, 'Error Server');
    }
  }
  setInterval(checkStatusAndUptime, 1000);
  checkStatusAndUptime();

  // ==================== KIRIM MEDIA (DENGAN PROGRESS BAR) ====================
  async function sendMedia() {
    const to = document.getElementById('to').value.trim();
    const caption = document.getElementById('caption').value;

    if (!to) { showToast('Harap isi Nomor Tujuan!', true); return; }
    if (!fileInput.files.length) { showToast('Pilih foto/video terlebih dahulu!', true); return; }

    const file = fileInput.files[0];
    const isImage = file.type.startsWith('image/');
    const maxSize = isImage ? MAX_IMAGE_SIZE : MAX_VIDEO_SIZE;
    const maxLabel = isImage ? '20 MB' : '40 MB';

    if (!isImage && !file.type.startsWith('video/')) {
      showToast('Hanya foto/video yang didukung!', true); return;
    }
    if (file.size > maxSize) {
      showToast(`File terlalu besar (maks ${maxLabel})`, true); return;
    }

    btnSend.disabled = true;
    btnSend.textContent = 'Mengunggah...';
    resultBox.style.display = 'block';
    resultBox.style.color = '#a8c7fa';
    resultBox.textContent = 'Memproses...';
    
    // Tampilkan Progress Bar & Peringatan
    progressContainer.style.display = 'block';
    warningText.classList.add('show'); // Tampilkan teks peringatan tebal
    progressBar.style.width = '0%';
    progressBar.textContent = '0%';

    try {
      const formData = new FormData();
      formData.append('to', to);
      formData.append('message', caption);
      formData.append('file', file);

      // Menggunakan XMLHttpRequest untuk memantau progress
      const xhr = new XMLHttpRequest();
      
      const uploadPromise = new Promise((resolve, reject) => {
        xhr.open('POST', `${API_URL}/upload-media`, true);
        xhr.setRequestHeader('x-api-key', API_KEY);

        // Event listener untuk update progress
        xhr.upload.onprogress = (event) => {
          if (event.lengthComputable) {
            const percentComplete = Math.round((event.loaded / event.total) * 100);
            progressBar.style.width = percentComplete + '%';
            progressBar.textContent = percentComplete + '%';
          }
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(JSON.parse(xhr.responseText));
          } else {
            reject(new Error(`Server Error: ${xhr.status}`));
          }
        };

        xhr.onerror = () => reject(new Error('Terjadi kesalahan jaringan saat upload.'));
        xhr.send(formData);
      });

      const data = await uploadPromise;
      
      // Sembunyikan progress bar setelah selesai
      progressContainer.style.display = 'none';
      warningText.classList.remove('show');
      btnSend.textContent = 'Mengirim ke WhatsApp...';
      resultBox.textContent = 'File berhasil diunggah ke server, sedang mengirim ke WhatsApp...';

      // Beri jeda sedikit agar user tahu file sudah diupload
      await new Promise(r => setTimeout(r, 500));

      if (data.success) {
        resultBox.style.color = '#00a884';
        resultBox.textContent = '✅ Berhasil dikirim!\n' + JSON.stringify(data, null, 2);
        showToast('Media berhasil dikirim!');
      } else {
        resultBox.style.color = 'var(--red)';
        resultBox.textContent = '❌ Gagal:\n' + (data.error || 'Terjadi kesalahan');
        showToast(data.error || 'Gagal mengirim media', true);
      }
    } catch (e) {
      progressContainer.style.display = 'none';
      warningText.classList.remove('show');
      resultBox.style.color = 'var(--red)';
      resultBox.textContent = '❌ Error Jaringan:\n' + e.message;
      showToast('Terjadi kesalahan jaringan', true);
    } finally {
      btnSend.disabled = false;
      btnSend.textContent = '🚀 Kirim Media';
    }
  }
</script>
</body>
 </html>
