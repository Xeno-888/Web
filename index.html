<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  html, body{
    width:100%;
    height:100%;
    overflow:hidden;          /* cegah scroll */
    overscroll-behavior:none; /* cegah bounce di mobile */
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#05060a;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    position:fixed;           /* kunci body biar tidak bisa digeser */
    inset:0;
    padding:20px;
    -webkit-tap-highlight-color:transparent;
  }

  /* Wrapper background — semua efek visual di sini, di-clip */
  .bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }

  /* Grid statis */
  .bg::before{
    content:'';
    position:absolute;
    inset:-20%;
    background-image:
      linear-gradient(rgba(0,229,255,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,229,255,.06) 1px,transparent 1px);
    background-size:60px 60px;
    transform:perspective(500px) rotateX(55deg);
    transform-origin:center;
    opacity:.6;
  }

  /* Orb */
  .orb{
    position:absolute;
    border-radius:50%;
    will-change:transform;
  }
  .orb.a{
    width:420px;height:420px;
    top:-140px;left:-120px;
    background:radial-gradient(circle,rgba(0,229,255,.45),transparent 70%);
    animation:float 14s ease-in-out infinite;
  }
  .orb.b{
    width:380px;height:380px;
    bottom:-130px;right:-100px;
    background:radial-gradient(circle,rgba(180,0,255,.4),transparent 70%);
    animation:float 16s ease-in-out infinite -6s;
  }
  @keyframes float{
    0%,100%{transform:translate(0,0)}
    50%{transform:translate(25px,-30px)}
  }

  /* Kartu */
  .card{
    position:relative;
    z-index:2;
    width:min(100%,420px);
    max-height:calc(100dvh - 40px);
    overflow-y:auto;
    padding:44px 30px 36px;
    border-radius:24px;
    text-align:center;
    background:rgba(12,14,24,.7);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(0,229,255,.25);
    box-shadow:
      0 0 40px rgba(0,229,255,.15),
      0 0 80px rgba(180,0,255,.1);
    animation:appear .7s ease-out both;
    scrollbar-width:none;
  }
  .card::-webkit-scrollbar{display:none}
  @keyframes appear{
    from{opacity:0;transform:translateY(25px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* Avatar */
  .avatar{
    width:88px;height:88px;
    margin:0 auto 22px;
    border-radius:50%;
    display:grid;place-items:center;
    background:linear-gradient(135deg,#00e5ff,#b400ff);
    box-shadow:0 0 30px rgba(0,229,255,.55);
    animation:pulse 3s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 25px rgba(0,229,255,.5)}
    50%{box-shadow:0 0 40px rgba(0,229,255,.85)}
  }
  .avatar svg{width:42px;height:42px;fill:#05060a}

  h1{
    font-size:1.9rem;
    letter-spacing:3px;
    font-weight:800;
    background:linear-gradient(90deg,#00e5ff,#b400ff,#00e5ff);
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shine 5s linear infinite;
  }
  @keyframes shine{to{background-position:200% center}}

  .handle{
    margin-top:6px;
    font-size:.9rem;
    color:#7f8ea3;
    letter-spacing:1.5px;
  }

  .desc{
    margin:18px 0 28px;
    font-size:.87rem;
    line-height:1.6;
    color:#9aa7b8;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:16px 22px;
    border-radius:14px;
    font-size:1rem;
    font-weight:700;
    letter-spacing:.5px;
    text-decoration:none;
    color:#05060a;
    background:linear-gradient(135deg,#00e5ff,#5b6bff,#b400ff);
    box-shadow:0 8px 24px rgba(0,229,255,.3);
    transition:transform .2s,box-shadow .2s;
  }
  .btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 32px rgba(180,0,255,.45);
  }
  .btn:active{transform:translateY(0) scale(.99)}
  .btn svg{width:20px;height:20px;fill:#05060a}

  .note{
    margin-top:20px;
    font-size:.72rem;
    color:#55637a;
    letter-spacing:.8px;
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

  <div class="bg">
    <div class="orb a"></div>
    <div class="orb b"></div>
  </div>

  <main class="card">
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M9.04 15.31l-.38 5.36c.54 0 .78-.23 1.06-.51l2.55-2.44 5.29 3.87c.97.54 1.66.26 1.92-.9l3.48-16.26c.31-1.45-.52-2.02-1.47-1.66L1.7 9.9c-1.42.55-1.4 1.34-.24 1.7l5.3 1.65 12.3-7.75c.58-.38 1.11-.17.68.21l-9.7 8.6z"/></svg>
    </div>

    <h1>XENO</h1>

    <p class="desc">
       Akun resmi.<br>
      Konten eksklusif, update terbaru, dan info menarik lainnya.
    </p>

    <a class="btn" href="https://t.me/Xeno18" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24"><path d="M9.04 15.31l-.38 5.36c.54 0 .78-.23 1.06-.51l2.55-2.44 5.29 3.87c.97.54 1.66.26 1.92-.9l3.48-16.26c.31-1.45-.52-2.02-1.47-1.66L1.7 9.9c-1.42.55-1.4 1.34-.24 1.7l5.3 1.65 12.3-7.75c.58-.38 1.11-.17.68.21l-9.7 8.6z"/></svg>
      Buka Telegram
    </a>
  </main>

</body>
</html>
