<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05060a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Grid latar belakang */
  body::before {
    content: '';
    position: absolute;
    inset: -50%;
    background-image:
      linear-gradient(rgba(0, 255, 255, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 255, 0.07) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(500px) rotateX(55deg);
    animation: gridMove 12s linear infinite;
  }
  @keyframes gridMove {
    from { background-position: 0 0; }
    to   { background-position: 0 60px; }
  }

  /* Orb cahaya */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    animation: float 9s ease-in-out infinite;
  }
  .orb.a { width: 380px; height: 380px; background: #00e5ff; top: -120px; left: -100px; }
  .orb.b { width: 320px; height: 320px; background: #b400ff; bottom: -110px; right: -80px; animation-delay: -4s; }
  .orb.c { width: 240px; height: 240px; background: #ff007a; top: 45%; left: 55%; animation-delay: -2s; opacity: .35; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(30px, -35px) scale(1.12); }
  }

  /* Kartu utama */
  .card {
    position: relative;
    z-index: 2;
    width: min(92vw, 420px);
    padding: 48px 34px 40px;
    border-radius: 26px;
    text-align: center;
    background: rgba(12, 14, 24, 0.65);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(0, 229, 255, 0.28);
    box-shadow:
      0 0 40px rgba(0, 229, 255, 0.18),
      0 0 100px rgba(180, 0, 255, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    animation: appear 1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes appear {
    from { opacity: 0; transform: translateY(35px) scale(.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Avatar / ikon */
  .avatar {
    width: 96px;
    height: 96px;
    margin: 0 auto 24px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #00e5ff, #b400ff);
    box-shadow: 0 0 30px rgba(0, 229, 255, .6);
    position: relative;
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 25px rgba(0,229,255,.5), 0 0 60px rgba(180,0,255,.25); }
    50%      { box-shadow: 0 0 45px rgba(0,229,255,.9), 0 0 90px rgba(180,0,255,.45); }
  }
  .avatar svg { width: 46px; height: 46px; fill: #05060a; }

  h1 {
    font-size: 2rem;
    letter-spacing: 3px;
    font-weight: 800;
    background: linear-gradient(90deg, #00e5ff, #b400ff, #00e5ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }

  .handle {
    margin-top: 8px;
    font-size: .95rem;
    color: #7f8ea3;
    letter-spacing: 1.5px;
  }

  .desc {
    margin: 20px 0 30px;
    font-size: .88rem;
    line-height: 1.65;
    color: #9aa7b8;
  }

  /* Tombol */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    width: 100%;
    padding: 17px 24px;
    border-radius: 15px;
    font-size: 1.02rem;
    font-weight: 700;
    letter-spacing: .6px;
    text-decoration: none;
    color: #05060a;
    background: linear-gradient(135deg, #00e5ff, #5b6bff, #b400ff);
    background-size: 200% auto;
    position: relative;
    overflow: hidden;
    transition: transform .25s ease, box-shadow .25s ease, background-position .5s ease;
    box-shadow: 0 8px 28px rgba(0, 229, 255, .35);
  }
  .btn:hover {
    transform: translateY(-3px);
    background-position: right center;
    box-shadow: 0 14px 40px rgba(180, 0, 255, .5);
  }
  .btn:active { transform: translateY(-1px) scale(.99); }
  .btn svg { width: 21px; height: 21px; fill: #05060a; }

  /* Kilau menyapu tombol */
  .btn::after {
    content: '';
    position: absolute;
    top: 0; left: -120%;
    width: 60%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    transform: skewX(-20deg);
    animation: sweep 3.2s ease-in-out infinite;
  }
  @keyframes sweep {
    0%, 60% { left: -120%; }
    100%    { left: 160%; }
  }

  .note {
    margin-top: 22px;
    font-size: .74rem;
    color: #55637a;
    letter-spacing: .8px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>

  <main class="card">
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M9.04 15.31l-.38 5.36c.54 0 .78-.23 1.06-.51l2.55-2.44 5.29 3.87c.97.54 1.66.26 1.92-.9l3.48-16.26c.31-1.45-.52-2.02-1.47-1.66L1.7 9.9c-1.42.55-1.4 1.34-.24 1.7l5.3 1.65 12.3-7.75c.58-.38 1.11-.17.68.21l-9.7 8.6z"/></svg>
    </div>

    <h1>XENO</h1>
    <p class="handle">t.me/Xeno18</p>

    <p class="desc">
      Gabung ke channel Telegram resmi.<br>
      Konten eksklusif, update terbaru, dan info menarik lainnya.
    </p>

    <a class="btn" href="https://t.me/Xeno18" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24"><path d="M9.04 15.31l-.38 5.36c.54 0 .78-.23 1.06-.51l2.55-2.44 5.29 3.87c.97.54 1.66.26 1.92-.9l3.48-16.26c.31-1.45-.52-2.02-1.47-1.66L1.7 9.9c-1.42.55-1.4 1.34-.24 1.7l5.3 1.65 12.3-7.75c.58-.38 1.11-.17.68.21l-9.7 8.6z"/></svg>
      Buka Telegram
    </a>

    <p class="note">© Xeno18 • All rights reserved</p>
  </main>

</body>
</html>
